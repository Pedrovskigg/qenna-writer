name: mac-remote

# Mac da nuvem com tela remota pra testar o Qenna na mão. Só roda quando
# alguém empurra o branch mac-remote (git push origin mac-build:mac-remote). Acesso pelo Tailscale (rede
# privada do Pe), com senha VNC: nada fica exposto na internet.
on:
  push:
    branches: [mac-remote]

jobs:
  mac:
    runs-on: macos-14
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4

      - name: Tailscale
        uses: tailscale/github-action@v3
        with:
          authkey: ${{ secrets.TAILSCALE_AUTHKEY }}
          hostname: qenna-mac

      - name: Compartilhamento de tela
        env:
          VNC_PASSWORD: ${{ secrets.VNC_PASSWORD }}
        run: |
          # Os visualizadores pedem usuário + senha do macOS (autenticação da Apple).
          # A senha do runner não dá pra trocar sem a antiga, então criamos um
          # usuário próprio: login = qenna, senha = a mesma do VNC. Ele controla a
          # tela que já está logada (a do runner), onde o Qenna abre.
          sudo sysadminctl -addUser qenna -fullName Qenna -password "$VNC_PASSWORD" -admin || true
          dscl . -read /Users/qenna RecordName || echo "USUARIO NAO CRIADO"
          # Entrando como qenna o Mac abre uma sessão própria (vazia, preta). A tela
          # onde o Qenna abre é a do runner: dá a ele a mesma senha, com o qenna
          # (admin) autorizando.
          sudo sysadminctl -resetPasswordFor runner -newPassword "$VNC_PASSWORD" -adminUser qenna -adminPassword "$VNC_PASSWORD" 2>&1 | tee -a diag.txt || true
          KS=/System/Library/CoreServices/RemoteManagement/ARDAgent.app/Contents/Resources/kickstart
          sudo $KS -configure -allowAccessFor -allUsers -privs -all -access -on -users qenna
          sudo $KS -configure -clientopts -setvnclegacy -vnclegacy yes
          # Senha VNC "legada" (até 8 caracteres), no formato que o ARD espera.
          echo "$VNC_PASSWORD" | perl -we 'BEGIN { @k = unpack "C*", pack "H*", "1734516E8BA8C5E2FF1C39567390ADCA"}; $_ = <>; chomp; s/^(.{8}).*/$1/; @p = unpack "C*", $_; foreach (@k) { printf "%02X", $_ ^ (shift @p || 0) }; print "\n"' | sudo tee /Library/Preferences/com.apple.VNCSettings.txt > /dev/null
          # Sem permissão de gravação de tela (TCC) o serviço de compartilhamento
          # manda imagem toda preta. Nos Macs do GitHub o TCC.db do sistema é
          # gravável (é assim que eles liberam o screencapture).
          DB="/Library/Application Support/com.apple.TCC/TCC.db"
          for svc in kTCCServiceScreenCapture kTCCServicePostEvent kTCCServiceAccessibility; do
            for c in com.apple.screensharing.agent com.apple.RemoteDesktopAgent com.apple.RemoteManagementAgent com.apple.screensharingd; do
              sudo sqlite3 "$DB" "INSERT OR REPLACE INTO access VALUES('$svc','$c',0,2,4,1,NULL,NULL,0,'UNUSED',NULL,0,1700000000,NULL,NULL,'UNUSED',0);" || true
            done
            for c in /System/Library/CoreServices/RemoteManagement/ARDAgent.app/Contents/MacOS/ARDAgent /System/Library/CoreServices/RemoteManagement/screensharingd.bundle/Contents/MacOS/screensharingd /System/Library/CoreServices/RemoteManagement/ScreensharingAgent.bundle/Contents/MacOS/ScreensharingAgent; do
              sudo sqlite3 "$DB" "INSERT OR REPLACE INTO access VALUES('$svc','$c',1,2,4,1,NULL,NULL,0,'UNUSED',NULL,0,1700000000,NULL,NULL,'UNUSED',0);" || true
            done
          done
          sudo sqlite3 "$DB" "SELECT service, client FROM access WHERE client LIKE '%creen%' OR client LIKE '%ARD%' OR client LIKE '%Remote%';" || true
          # Tela sempre acordada.
          sudo pmset -a displaysleep 0 sleep 0 || true
          caffeinate -dimsu &
          sudo pkill -f screensharingd || true
          sudo $KS -activate -restart -agent -console
          sleep 5
          nc -z localhost 5900 && echo "VNC OUVINDO na 5900" || echo "VNC NAO SUBIU"
          tailscale ip -4 || true

      - name: Diagnóstico
        continue-on-error: true
        run: |
          mkdir -p diag
          screencapture -x diag/tela.png || true
          sudo sqlite3 "/Library/Application Support/com.apple.TCC/TCC.db" "SELECT service, client, auth_value FROM access;" > diag/tcc.txt 2>&1 || true
          sudo $(echo /System/Library/CoreServices/RemoteManagement/ARDAgent.app/Contents/Resources/kickstart) -help > /dev/null 2>&1 || true
          (who; ps aux | grep -iE 'screensharing|ARDAgent|loginwindow' | grep -v grep) > diag/proc.txt 2>&1
          cp diag.txt diag/ 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        with:
          name: diag
          path: diag/

      - name: Hunspell
        run: git clone --depth 1 --branch v1.7.2 https://github.com/hunspell/hunspell.git third_party/hunspell

      - name: Qt 6.8.3
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          host: mac
          target: desktop
          arch: clang_64
          modules: 'qtmultimedia qtspeech'
          cache: true

      - name: Build
        run: |
          brew install ninja || true
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build

      - name: Abrir o Qenna e esperar
        run: |
          open build/qenna-writer.app
          echo "Pronto. Conecte em qenna-mac:5900. A sessão fica de pé até ser cancelada."
          sleep 19000
