name: mac-remote

# Mac da nuvem com tela remota pra testar o Qenna na mão. Só roda quando
# alguém empurra o branch mac-remote (git push origin mac-build:mac-remote). Acesso pelo Tailscale (rede
# privada do Pe), com senha VNC: nada fica exposto na internet.
on:
  push:
    branches: [mac-remote]

jobs:
  mac:
    runs-on: macos-14
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4

      - name: Tailscale
        uses: tailscale/github-action@v3
        with:
          authkey: ${{ secrets.TAILSCALE_AUTHKEY }}
          hostname: qenna-mac

      # O compartilhamento de tela da Apple, nestes Macs, só manda imagem preta
      # (fica fora das permissões de gravação de tela). O macVNC (LibVNC, GPL)
      # roda a partir do shell do job, que já tem permissão de capturar a tela
      # (é o mesmo caminho do screencapture). Login: só a senha.
      - name: Servidor de tela (macVNC)
        env:
          VNC_PASSWORD: ${{ secrets.VNC_PASSWORD }}
        run: |
          brew install libvncserver || true
          git clone --depth 1 https://github.com/LibVNC/macVNC.git /tmp/macVNC
          cmake -S /tmp/macVNC -B /tmp/macVNC/build -DCMAKE_BUILD_TYPE=Release
          cmake --build /tmp/macVNC/build
          BIN=$(find /tmp/macVNC/build -type f -perm -u+x -name 'macVNC*' | head -1)
          echo "BIN=$BIN"
          DB="/Library/Application Support/com.apple.TCC/TCC.db"
          for svc in kTCCServiceScreenCapture kTCCServicePostEvent kTCCServiceAccessibility; do
            for c in "$BIN" /bin/bash /usr/local/opt/runner/provisioner/provisioner; do
              sudo sqlite3 "$DB" "INSERT OR REPLACE INTO access VALUES('$svc','$c',1,2,4,1,NULL,NULL,0,'UNUSED',NULL,0,1700000000,NULL,NULL,'UNUSED',0);" || true
            done
          done
          sudo pmset -a displaysleep 0 sleep 0 || true
          caffeinate -dimsu &
          "$BIN" -h 2>&1 | head -30 || true
          nohup "$BIN" -rfbport 5901 -passwd "$VNC_PASSWORD" > /tmp/macvnc.log 2>&1 &
          sleep 6
          cat /tmp/macvnc.log
          nc -z localhost 5901 && echo "macVNC OUVINDO na 5901" || echo "macVNC NAO SUBIU"

      - name: Hunspell
        run: git clone --depth 1 --branch v1.7.2 https://github.com/hunspell/hunspell.git third_party/hunspell

      - name: Qt 6.8.3
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          host: mac
          target: desktop
          arch: clang_64
          modules: 'qtmultimedia qtspeech'
          cache: true

      - name: Build
        run: |
          brew install ninja || true
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build

      - name: Abrir o Qenna e esperar
        run: |
          open build/qenna-writer.app
          echo "Pronto. Conecte em qenna-mac:5900. A sessão fica de pé até ser cancelada."
          sleep 19000
